<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduExam - Quản Lý & Chấm Điểm Bài Kiểm Tra Trực Tuyến</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Tùy chỉnh thanh cuộn đẹp mắt */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Thông báo Toast Modal / Notification -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-y-[-120%] opacity-0 pointer-events-none flex items-center p-4 max-w-sm w-full bg-white rounded-xl shadow-2xl border border-slate-100">
    <div id="toastIcon" class="w-10 h-10 rounded-full flex items-center justify-center mr-3 text-white bg-blue-600 shrink-0">
      <i class="fa-solid fa-check"></i>
    </div>
    <div class="flex-1">
      <h4 id="toastTitle" class="font-bold text-sm text-slate-900">Thông báo</h4>
      <p id="toastMessage" class="text-xs text-slate-600 mt-0.5">Nội dung tin nhắn...</p>
    </div>
  </div>

  <!-- Thanh Điều Hướng (Navbar) -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigateHome()">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-graduation-cap text-lg"></i>
        </div>
        <div>
          <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-blue-600 to-indigo-700 bg-clip-text text-transparent">EduExam</span>
          <span class="hidden sm:inline-block text-xs font-semibold text-slate-400 ml-2 px-2 py-0.5 bg-slate-100 rounded-md">Thi & Chấm Điểm</span>
        </div>
      </div>

      <!-- Khu vực trạng thái người dùng đăng nhập -->
      <div id="userNavArea" class="flex items-center space-x-3">
        <!-- Render bằng Javascript -->
      </div>
    </div>
  </header>

  <!-- Vùng chứa ứng dụng chính (Dynamic Views) -->
  <main id="appContainer" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <!-- Nội dung các trang sẽ được render linh hoạt tại đây -->
  </main>

  <!-- Modal xác nhận chung (Không dùng alert/confirm của browser) -->
  <div id="customModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all">
      <div class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mb-4 text-xl">
        <i class="fa-solid fa-circle-exclamation"></i>
      </div>
      <h3 id="modalTitle" class="text-lg font-bold text-slate-900 mb-2">Xác nhận</h3>
      <p id="modalMsg" class="text-sm text-slate-600 mb-6">Bạn có chắc chắn muốn thực hiện hành động này?</p>
      <div class="flex justify-end space-x-3">
        <button id="modalBtnCancel" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">Hủy bỏ</button>
        <button id="modalBtnConfirm" class="px-5 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md transition">Đồng ý</button>
      </div>
    </div>
  </div>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    <p>© 2026 EduExam Portal - Hệ thống thi & chấm bài trực tuyến cho Giáo viên & Học sinh</p>
  </footer>

  <script>
    /* =========================================================================
       DỮ LIỆU MẪU & KHỞI TẠO HỆ THỐNG
       ========================================================================= */
    const DEFAULT_DATA = {
      users: [
        { id: 'giaovien', name: 'Thầy Hoàng Minh', role: 'teacher', pass: '123456' },
        { id: 'nguyenngocanh', name: 'Nguyễn Ngọc Ánh', role: 'student', pass: '123456' },
        { id: 'tranthimai', name: 'Trần Thị Mai', role: 'student', pass: '123456' }
      ],
      exams: [
        {

          title: 'Bài Kiểm Tra Tổng Hợp Giữa Kỳ - Ngữ Văn & Tư Duy Logic',
          subject: 'Ngữ Văn & Xã Hội',
          duration: 30, // phút
          teacherId: 'giaovien',
          createdAt: '2026-10-10',
          questions: [
            {

              type: 'choice',

              options: [

            },

              options: [
                'A. Nước chảy đá mòn',
                'B. Uống nước nhớ nguồn',
                'C. Thất bại là mẹ thành công',
                'D. Lá lành đùm lá rách'
              ],
              correctAnswer: 0, // index A
              points: 2
            },
            {

              text: 'Viết đoạn văn ngắn (từ 5-7 dòng) nêu suy nghĩ của em về vai trò của tính tự lập đối với học sinh trung học hiện nay.',
              points: 3,

              points: 3,
              hint: 'Khả năng phản biện, thái độ tích cực, kỹ năng diễn đạt.'
            }
          ]
        }
      ],
      submissions: [
        {
          id: 'sub-001',
          examId: 'exam-101',
          studentId: 'nguyenngocanh',
          submittedAt: '2026-10-15 14:30',
          status: 'graded', // 'submitted' hoặc 'graded'
          answers: {
            q1: 1, // Chọn B (Đúng)
            q2: 0, // Chọn A (Đúng)
            q3: 'Tính tự lập là đức tính vô cùng cần thiết đối với mỗi học sinh. Khi tự lập, chúng ta chủ động quản lý thời gian, tự giác học tập mà không cần cha mẹ nhắc nhở. Điều này giúp rèn luyện bản lĩnh vững vàng trước thử thách và chuẩn bị hành trang bước vào giảng đường đại học cũng như cuộc sống xã hội độc lập.',
            q4: 'Em muốn nhắn nhủ: "Hãy để mạng xã hội làm bàn đạp mở rộng tri thức thay vì trở thành chiếc lồng giam giữ thời gian của bạn". Chúng ta cần chọn lọc nội dung tích cực, hạn chế so sánh tiêu cực và luôn tôn trọng người khác khi tương tác online.'
          },
          grading: {
            scores: {
              q1: 2,
              q2: 2,
              q3: 2.75,
              q4: 2.75
            },
            comments: {
              q3: 'Lập luận sắc bén, câu văn mạch lạc, dẫn chứng rất thuyết phục!',
              q4: 'Ý tưởng thông điệp rất sáng tạo và có sức lan tỏa tốt. Cần phát huy!'
            },
            overallComment: 'Bài làm rất xuất sắc! Em nắm chắc cả kiến thức cơ bản lẫn khả năng lập luận sắc sảo. Cố gắng giữ vững phong độ nhé!',
            totalScore: 9.5
          }
        }
      ]
    };

    // Quản lý cơ sở dữ liệu giả lập trong bộ nhớ hoặc LocalStorage
    class Database {
      constructor() {
        this.STORAGE_KEY = 'edu_exam_system_db';
        this.load();
      }

      load() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (raw) {
            this.data = JSON.parse(raw);
          } else {
            this.data = DEFAULT_DATA;
            this.save();
          }
        } catch (e) {
          this.data = DEFAULT_DATA;
        }
      }

      save() {
        try {
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.data));
        } catch (e) {
          console.warn('LocalStorage error', e);
        }
      }

      findUser(id, pass) {
        return this.data.users.find(u => u.id.toLowerCase() === id.trim().toLowerCase() && u.pass === pass);
      }

      userExists(id) {
        return this.data.users.some(u => u.id.toLowerCase() === id.trim().toLowerCase());
      }

      addUser(user) {
        this.data.users.push(user);
        this.save();
      }

      getExams() {
        return this.data.exams;
      }

      getExamById(id) {
        return this.data.exams.find(e => e.id === id);
      }

      addExam(exam) {
        this.data.exams.unshift(exam);
        this.save();
      }

      deleteExam(id) {
        this.data.exams = this.data.exams.filter(e => e.id !== id);
        this.data.submissions = this.data.submissions.filter(s => s.examId !== id);
        this.save();
      }

      getSubmissionsByExam(examId) {
        return this.data.submissions.filter(s => s.examId === examId);
      }

      getSubmission(examId, studentId) {
        return this.data.submissions.find(s => s.examId === examId && s.studentId === studentId);
      }

      getSubmissionById(subId) {
        return this.data.submissions.find(s => s.id === subId);
      }

      saveSubmission(sub) {
        const index = this.data.submissions.findIndex(s => s.id === sub.id);
        if (index >= 0) {
          this.data.submissions[index] = sub;
        } else {
          this.data.submissions.push(sub);
        }
        this.save();
      }
    }

    const db = new Database();

    /* =========================================================================
       APP CONTROLLER & TRẠNG THÁI ỨNG DỤNG
       ========================================================================= */
    const app = {
      currentUser: null,
      currentView: 'auth', // 'auth', 'teacher_dashboard', 'teacher_create_exam', 'teacher_grading', 'student_dashboard', 'student_take_exam', 'student_result'
      viewParams: {},
      examTimerInterval: null,

      init() {
        // Kiểm tra phiên đăng nhập đã lưu
        const savedUserId = sessionStorage.getItem('edu_user_id');
        if (savedUserId) {
          const user = db.data.users.find(u => u.id === savedUserId);
          if (user) {
            this.currentUser = user;
          }
        }
        this.updateHeader();
        if (this.currentUser) {
          this.navigateRoleHome();
        } else {
          this.renderAuth();
        }
      },

      showToast(title, msg, type = 'success') {
        const toast = document.getElementById('toast');
        const tTitle = document.getElementById('toastTitle');
        const tMsg = document.getElementById('toastMessage');
        const tIcon = document.getElementById('toastIcon');

        tTitle.textContent = title;
        tMsg.textContent = msg;

        if (type === 'success') {
          tIcon.className = 'w-10 h-10 rounded-full flex items-center justify-center mr-3 text-white bg-emerald-500 shrink-0';
          tIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
        } else if (type === 'error') {
          tIcon.className = 'w-10 h-10 rounded-full flex items-center justify-center mr-3 text-white bg-rose-500 shrink-0';
          tIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
        } else {
          tIcon.className = 'w-10 h-10 rounded-full flex items-center justify-center mr-3 text-white bg-blue-600 shrink-0';
          tIcon.innerHTML = '<i class="fa-solid fa-info"></i>';
        }

        toast.classList.remove('translate-y-[-120%]', 'opacity-0', 'pointer-events-none');
        setTimeout(() => {
          toast.classList.add('translate-y-[-120%]', 'opacity-0', 'pointer-events-none');
        }, 3500);
      },

      openModal(title, msg, onConfirm) {
        const modal = document.getElementById('customModal');
        const mTitle = document.getElementById('modalTitle');
        const mMsg = document.getElementById('modalMsg');
        const btnConfirm = document.getElementById('modalBtnConfirm');
        const btnCancel = document.getElementById('modalBtnCancel');

        mTitle.textContent = title;
        mMsg.textContent = msg;
        modal.classList.remove('hidden');

        const handleConfirm = () => {
          modal.classList.add('hidden');
          btnConfirm.removeEventListener('click', handleConfirm);
          onConfirm();
        };

        const handleCancel = () => {
          modal.classList.add('hidden');
          btnConfirm.removeEventListener('click', handleConfirm);
          btnCancel.removeEventListener('click', handleCancel);
        };

        btnConfirm.addEventListener('click', handleConfirm);
        btnCancel.addEventListener('click', handleCancel);
      },

      updateHeader() {
        const area = document.getElementById('userNavArea');
        if (!this.currentUser) {
          area.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-xs text-slate-500">Chưa đăng nhập</span>
            </div>
          `;
          return;
        }

        const isTeacher = this.currentUser.role === 'teacher';
        area.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="text-right hidden sm:block">
              <div class="text-sm font-bold text-slate-800">${this.currentUser.name}</div>
              <div class="text-xs font-semibold ${isTeacher ? 'text-indigo-600' : 'text-blue-600'}">
                ${isTeacher ? '<i class="fa-solid fa-chalkboard-user mr-1"></i>Giáo Viên' : '<i class="fa-solid fa-user-graduate mr-1"></i>Học Sinh'} (${this.currentUser.id})
              </div>
            </div>
            <div class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white shadow-sm ${isTeacher ? 'bg-indigo-600' : 'bg-blue-600'}">
              ${this.currentUser.name.charAt(0)}
            </div>
            <button onclick="app.logout()" title="Đăng xuất" class="p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition ml-1">
              <i class="fa-solid fa-arrow-right-from-bracket text-base"></i>
            </button>
          </div>
        `;
      },

      navigateHome() {
        if (!this.currentUser) {
          this.renderAuth();
        } else {
          this.navigateRoleHome();
        }
      },

      navigateRoleHome() {
        if (this.currentUser.role === 'teacher') {
          this.renderTeacherDashboard();
        } else {
          this.renderStudentDashboard();
        }
      },

      logout() {
        this.openModal('Đăng xuất', 'Bạn có chắc chắn muốn đăng xuất khỏi phiên làm việc?', () => {
          if (this.examTimerInterval) clearInterval(this.examTimerInterval);
          this.currentUser = null;
          sessionStorage.removeItem('edu_user_id');
          this.updateHeader();
          this.renderAuth();
          this.showToast('Thành công', 'Đã đăng xuất an toàn.');
        });
      },

      /* =========================================================================
         1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ
         ========================================================================= */
      renderAuth(tab = 'login') {
        const container = document.getElementById('appContainer');
        container.innerHTML = `
          <div class="max-w-md mx-auto my-6 bg-white p-6 sm:p-8 rounded-2xl shadow-xl border border-slate-100">
            <div class="text-center mb-6">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl mb-3 shadow-inner">
                <i class="fa-solid fa-shield-halved"></i>
              </div>
              <h2 class="text-2xl font-extrabold text-slate-800">Cổng Thi & Khảo Thí</h2>
              <p class="text-sm text-slate-500 mt-1">Đăng nhập tài khoản Học sinh hoặc Giáo viên để tiếp tục</p>
            </div>

            <!-- Tab Switcher -->
            <div class="flex p-1 bg-slate-100 rounded-xl mb-6">
              <button onclick="app.renderAuth('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition ${tab === 'login' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">Đăng Nhập</button>
              <button onclick="app.renderAuth('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition ${tab === 'register' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">Đăng Ký Tài Khoản</button>
            </div>

            ${tab === 'login' ? this.getLoginFormHtml() : this.getRegisterFormHtml()}

            <!-- Gợi ý tài khoản mẫu -->
            <div class="mt-8 pt-6 border-t border-slate-100 bg-slate-50/60 p-4 rounded-xl">
              <p class="text-xs font-bold text-slate-700 mb-2 flex items-center">
                <i class="fa-solid fa-lightbulb text-amber-500 mr-1.5"></i> Tài khoản mẫu thử nghiệm ngay:
              </p>
              <div class="space-y-2 text-xs text-slate-600">
                <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200">
                  <div>
                    <span class="font-bold text-indigo-600">Giáo viên:</span> ID: <code class="bg-slate-100 px-1 py-0.5 rounded">giaovien</code> | Pass: <code class="bg-slate-100 px-1 py-0.5 rounded">123456</code>
                  </div>
                  <button onclick="app.fillSample('giaovien', '123456')" class="text-blue-600 hover:underline font-semibold">Điền</button>
                </div>
                <div class="flex items-center justify-between p-2 bg-white rounded-lg border border-slate-200">
                  <div>
                    <span class="font-bold text-blue-600">Học sinh:</span> ID: <code class="bg-slate-100 px-1 py-0.5 rounded">nguyenngocanh</code> | Pass: <code class="bg-slate-100 px-1 py-0.5 rounded">123456</code>
                  </div>
                  <button onclick="app.fillSample('nguyenngocanh', '123456')" class="text-blue-600 hover:underline font-semibold">Điền</button>
                </div>
              </div>
            </div>
          </div>
        `;
      },

      fillSample(id, pass) {
        const idInput = document.getElementById('authId');
        const passInput = document.getElementById('authPass');
        if (idInput && passInput) {
          idInput.value = id;
          passInput.value = pass;
        }
      },

      getLoginFormHtml() {
        return `
          <form onsubmit="app.handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mã tài khoản (ID)</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                  <i class="fa-solid fa-user"></i>
                </span>
                <input type="text" id="authId" required placeholder="Ví dụ: nguyenngocanh" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mật khẩu</label>
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                  <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" id="authPass" required placeholder="Nhập mật khẩu (che kín)" class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm">
                <button type="button" onclick="app.togglePasswordVisibility('authPass', this)" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

      handleSaveExam(e) {
        e.preventDefault();
        const title = document.getElementById('newExamTitle').value.trim();
        const subject = document.getElementById('newExamSubject').value.trim();
        const duration = parseInt(document.getElementById('newExamDuration').value) || 45;

        const container = document.getElementById('questionsContainer');
        const qElements = container.querySelectorAll('.q-item');

        if (qElements.length === 0) {
          this.showToast('Lỗi', 'Vui lòng thêm ít nhất một câu hỏi vào đề kiểm tra.', 'error');
          return;
        }

        const questions = [];
        qElements.forEach((el, idx) => {
          const type = el.dataset.type;
          const points = parseFloat(el.querySelector('.q-points').value) || 1;
          const text = el.querySelector('.q-text').value.trim();

          if (type === 'choice') {
            const opt0 = el.querySelector('.q-opt-0').value.trim() || 'A';
            const opt1 = el.querySelector('.q-opt-1').value.trim() || 'B';
            const opt2 = el.querySelector('.q-opt-2').value.trim() || 'C';
            const opt3 = el.querySelector('.q-opt-3').value.trim() || 'D';
            const checkedRadio = el.querySelector('.q-correct:checked');
            const correctAnswer = checkedRadio ? parseInt(checkedRadio.value) : 0;

            questions.push({
              id: 'q_' + (idx + 1),
              type: 'choice',
              text: text,
              options: [opt0, opt1, opt2, opt3],
              correctAnswer: correctAnswer,
              points: points
            });
          } else {
            const hint = el.querySelector('.q-hint').value.trim();
            questions.push({
              id: 'q_' + (idx + 1),
              type: 'essay',
              text: text,
              points: points,
              hint: hint
            });
          }
        });

        const newExam = {
          id: 'exam_' + Date.now(),
          title: title,
          subject: subject,
          duration: duration,
          teacherId: this.currentUser.id,
          createdAt: new Date().toISOString().split('T')[0],
          questions: questions
        };

        db.addExam(newExam);
        this.showToast('Thành công', 'Đề kiểm tra mới đã được tạo và kích hoạt!');
        this.renderTeacherDashboard();
      },

      /* =========================================================================
         QUẢN LÝ BÀI NỘP CỦA HỌC SINH THEO ĐỀ THI
         ========================================================================= */
      renderTeacherSubmissions(examId) {
        const exam = db.getExamById(examId);

        const container = document.getElementById('appContainer');

        let rowsHtml = '';

          rowsHtml = `
            <tr>
              <td colspan="5" class="text-center py-8 text-slate-400 text-sm">

                Chưa có học sinh nào nộp bài cho đề kiểm tra này.
              </td>
            </tr>
          `;
        } else {
          rowsHtml = submissions.map((sub, idx) => {
            const student = db.data.users.find(u => u.id === sub.studentId) || { name: sub.studentId, id: sub.studentId };
            const isGraded = sub.status === 'graded';
            return `
              <tr class="hover:bg-slate-50 transition border-b border-slate-100">
                <td class="py-3.5 px-4 text-xs font-semibold text-slate-500">${idx + 1}</td>
                <td class="py-3.5 px-4">
                  <div class="text-sm font-bold text-slate-800">${student.name}</div>

                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700">
                      <i class="fa-solid fa-circle-check mr-1 text-[10px]"></i> Đã Chấm (${sub.grading?.totalScore} đ)
                    </span>
                  ` : `
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-bold bg-amber-100 text-amber-700">
                      <i class="fa-solid fa-hourglass-half mr-1 text-[10px]"></i> Chờ Chấm Điểm
                    </span>
                  `}
                </td>
                <td class="py-3.5 px-4 text-right">
                  <button onclick="app.renderGradingView('${sub.id}')" class="px-3.5 py-1.5 ${isGraded ? 'bg-slate-100 hover:bg-slate-200 text-slate-700' : 'bg-blue-600 hover:bg-blue-700 text-white'} rounded-xl text-xs font-bold transition flex items-center space-x-1.5 ml-auto">
                    <i class="fa-solid fa-pen-to-square"></i>

        container.innerHTML = `
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <button onclick="app.renderTeacherDashboard()" class="text-slate-500 hover:text-slate-800 text-sm font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Trang quản lý</span>
              </button>
              <div class="text-right">
                <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-700">${exam.subject}</span>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 class="text-xl font-bold text-slate-800">${exam.title}</h1>
                <p class="text-xs text-slate-500 mt-1">Danh sách học sinh đã hoàn thành bài kiểm tra và nộp lên hệ thống.</p>
              </div>
              <div class="flex items-center space-x-3 text-xs bg-slate-50 p-3 rounded-xl border border-slate-100">
                <div>Tổng số bài nộp: <b class="text-blue-600">${submissions.length}</b></div>
                <div class="w-px h-4 bg-slate-200"></div>
                <div>Đã chấm: <b class="text-emerald-600">${submissions.filter(s => s.status === 'graded').length}</b></div>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-50 text-[11px] font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">
                      <th class="py-3 px-4">#</th>
                      <th class="py-3 px-4">Học Sinh</th>
                      <th class="py-3 px-4">Thời Gian Nộp</th>

      /* =========================================================================
         KHU VỰC CHẤM THI CHI TIẾT & LỜI PHÊ (TEACHER GRADING)
         ========================================================================= */
      renderGradingView(subId) {
        const sub = db.getSubmissionById(subId);
        if (!sub) return;

        const exam = db.getExamById(sub.examId);
        const student = db.data.users.find(u => u.id === sub.studentId) || { name: sub.studentId, id: sub.studentId };
        const container = document.getElementById('appContainer');

        // Khởi tạo điểm trắc nghiệm tự động nếu chưa chấm
        let autoChoiceScores = {};
        exam.questions.forEach(q => {
          if (q.type === 'choice') {
            const studentAns = sub.answers ? sub.answers[q.id] : undefined;
            if (studentAns !== undefined && parseInt(studentAns) === q.correctAnswer) {
              autoChoiceScores[q.id] = q.points;
            } else {
              autoChoiceScores[q.id] = 0;
            }
          }
        });

        // Điểm hiện có
        const currentScores = sub.grading?.scores || autoChoiceScores;
        const currentComments = sub.grading?.comments || {};
        const overallComment = sub.grading?.overallComment || '';

        let questionsHtml = exam.questions.map((q, idx) => {
          const studentAns = sub.answers ? sub.answers[q.id] : null;
          const assignedScore = currentScores[q.id] !== undefined ? currentScores[q.id] : 0;
          const comment = currentComments[q.id] || '';

          if (q.type === 'choice') {
            const isCorrect = parseInt(studentAns) === q.correctAnswer;
            return `
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between">
                  <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-600">Trắc nghiệm</span>
                  </div>
                  <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-500">Điểm tự động:</span>
                    <span class="text-sm font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-500'}">${isCorrect ? q.points : 0} / ${q.points}đ</span>
                    <input type="hidden" class="grade-score" data-qid="${q.id}" value="${isCorrect ? q.points : 0}">
                  </div>
                </div>

                <p class="text-sm font-medium text-slate-800">${q.text}</p>

                <!-- Lựa chọn -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                  ${q.options.map((opt, oIdx) => {
                    const isSelected = studentAns !== null && parseInt(studentAns) === oIdx;
                    const isTheCorrectOne = q.correctAnswer === oIdx;
                    let styleClass = 'border-slate-200 bg-slate-50/50 text-slate-600';

                    if (isTheCorrectOne) {
                      styleClass = 'border-emerald-300 bg-emerald-50 text-emerald-800 font-semibold';
                    }
                    if (isSelected && !isTheCorrectOne) {
                      styleClass = 'border-rose-300 bg-rose-50 text-rose-800 font-semibold';
                    }

                    return `
                      <div class="p-2.5 rounded-xl border flex items-center justify-between ${styleClass}">
                        <span>${opt}</span>
                        <div>
                          ${isSelected ? '<span class="px-1.5 py-0.5 bg-slate-800 text-white rounded text-[10px] mr-1">Học sinh chọn</span>' : ''}
                          ${isTheCorrectOne ? '<i class="fa-solid fa-check text-emerald-600"></i>' : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          } else {
            // Tự luận - Cần Giáo viên chấm điểm và phê
            return `
              <div class="bg-white p-5 rounded-2xl border-2 border-indigo-100 shadow-sm space-y-4">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">Tự luận</span>
                  </div>
                  <div class="flex items-center space-x-2">
                    <label class="text-xs font-bold text-slate-700">Chấm điểm:</label>
                    <div class="flex items-center space-x-1">
                      <input type="number" step="0.25" min="0" max="${q.points}" value="${assignedScore}" data-qid="${q.id}" class="grade-score w-20 px-2 py-1 text-sm font-extrabold text-center rounded-lg border-2 border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-indigo-50/30 text-indigo-700">
                      <span class="text-xs font-bold text-slate-500">/ ${q.points} đ</span>
                    </div>
                  </div>
                </div>

                <div>
                  <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Đề bài:</h4>
                  <p class="text-sm font-semibold text-slate-800 bg-slate-50 p-3 rounded-xl border border-slate-200/80">${q.text}</p>
                  ${q.hint ? `<p class="text-[11px] text-amber-600 mt-1 italic"><i class="fa-regular fa-lightbulb mr-1"></i>Tiêu chí gợi ý: ${q.hint}</p>` : ''}
                </div>

                <!-- Bài làm của học sinh -->
                <div>
                  <h4 class="text-xs font-bold uppercase tracking-wider text-indigo-600 mb-1 flex items-center">
                    <i class="fa-solid fa-file-signature mr-1.5"></i> Bài làm của học sinh:
                  </h4>
                  <div class="p-4 rounded-xl bg-indigo-50/40 border border-indigo-200 text-slate-800 text-sm whitespace-pre-wrap leading-relaxed min-h-[90px]">
                    ${studentAns ? studentAns : '<i class="text-slate-400">Học sinh bỏ trống câu này, không có câu trả lời.</i>'}
                  </div>
                </div>

                <!-- Ô nhập lời phê riêng cho câu này -->
                <div class="pt-2">
                  <label class="block text-xs font-bold text-slate-700 mb-1 flex items-center text-emerald-700">
                    <i class="fa-solid fa-comment-dots mr-1.5"></i> Lời phê / Nhận xét của Giáo viên cho câu này:
                  </label>
                  <input type="text" data-qid="${q.id}" value="${comment}" placeholder="Ví dụ: Lập luận tốt, cần bổ sung dẫn chứng..." class="grade-comment w-full px-3.5 py-2 text-xs rounded-xl border border-emerald-300 focus:ring-2 focus:ring-emerald-500 bg-emerald-50/30">
                </div>
              </div>
            `;
          }
        }).join('');

        container.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-6">
            <div class="flex items-center justify-between">
              <button onclick="app.renderTeacherSubmissions('${exam.id}')" class="text-slate-500 hover:text-slate-800 text-sm font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Quay lại bài nộp</span>
              </button>
              <div class="text-xs font-bold text-slate-500">
                Chấm bài: <span class="text-indigo-600">${student.name}</span>
              </div>
            </div>

            <!-- Header bài thi -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <span class="text-xs font-bold px-2 py-0.5 rounded bg-indigo-50 text-indigo-600">${exam.subject}</span>
                <h1 class="text-lg font-bold text-slate-800 mt-1">${exam.title}</h1>
                <div class="text-xs text-slate-500 mt-1">
                  Học sinh: <b class="text-slate-700">${student.name}</b> (ID: ${student.id}) | Nộp lúc: ${sub.submittedAt}
                </div>
              </div>
              <div class="flex items-center space-x-3 bg-slate-50 p-3 rounded-xl border border-slate-100 shrink-0">
                <div class="text-center">
                  <span class="block text-[10px] text-slate-400 uppercase font-bold">Tổng điểm đề</span>
                  <span class="text-sm font-extrabold text-slate-700">${exam.questions.reduce((a, b) => a + b.points, 0)} đ</span>
                </div>
              </div>
            </div>

            <!-- Các câu hỏi & bài làm -->
            <div class="space-y-4">
              ${questionsHtml}
            </div>

            <!-- Ô nhận xét tổng quan & Nút hoàn thành chấm -->
            <div class="bg-white p-6 rounded-2xl border-2 border-emerald-300 shadow-lg space-y-4">
              <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center text-emerald-700">
                <i class="fa-solid fa-award mr-2"></i> Nhận Xét & Phê Duyệt Toàn Bài
              </h3>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1.5">Lời phê & Đánh giá tổng quát gửi đến học sinh:</label>
                <textarea id="overallCommentInput" rows="3" placeholder="Nhập lời khen ngợi, góp ý cải thiện hoặc dặn dò ôn tập cho học sinh..." class="w-full px-4 py-2.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500">${overallComment}</textarea>
              </div>

              <div class="flex flex-col sm:flex-row items-center justify-between pt-3 border-t border-slate-100 gap-3">
                <div class="text-xs text-slate-500">
                  <i class="fa-solid fa-circle-check text-emerald-500 mr-1"></i> Điểm và lời phê sẽ lập tức hiển thị cho học sinh xem.
                </div>
                <button onclick="app.saveGradingResult('${sub.id}')" class="w-full sm:w-auto px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-md shadow-emerald-500/20 transition flex items-center justify-center space-x-2">
                  <i class="fa-solid fa-floppy-disk"></i>
                  <span>Lưu Điểm & Gửi Lời Phê</span>
                </button>
              </div>
            </div>
          </div>
        `;
      },

      saveGradingResult(subId) {
        const sub = db.getSubmissionById(subId);
        if (!sub) return;

        const scoreInputs = document.querySelectorAll('.grade-score');
        const commentInputs = document.querySelectorAll('.grade-comment');
        const overallComment = document.getElementById('overallCommentInput').value.trim();

        const scores = {};
        let totalScore = 0;
        scoreInputs.forEach(input => {
          const qId = input.dataset.qid;
          const val = parseFloat(input.value) || 0;
          scores[qId] = val;
          totalScore += val;
        });

        const comments = {};
        commentInputs.forEach(input => {
          const qId = input.dataset.qid;
          comments[qId] = input.value.trim();
        });

        sub.status = 'graded';
        sub.grading = {
          scores: scores,
          comments: comments,
          overallComment: overallComment,
          totalScore: Math.round(totalScore * 100) / 100
        };

        db.saveSubmission(sub);
        this.showToast('Hoàn tất chấm điểm', `Đã lưu điểm (${totalScore} điểm) và lời phê cho học sinh.`);
        this.renderTeacherSubmissions(sub.examId);
      },

      /* =========================================================================
         3. GIAO DIỆN HỌC SINH (DASHBOARD, THI TRỰC TUYẾN & XEM ĐIỂM / LỜI PHÊ)
         ========================================================================= */
      renderStudentDashboard() {
        const exams = db.getExams();
        const container = document.getElementById('appContainer');

        let examsHtml = '';
        if (exams.length === 0) {
          examsHtml = `
            <div class="text-center py-12 bg-white rounded-2xl border border-dashed border-slate-300">
              <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
              <p class="text-slate-500 font-medium">Hiện tại chưa có bài kiểm tra nào được phát hành.</p>
            </div>
          `;
        } else {
          examsHtml = exams.map(exam => {
            const sub = db.getSubmission(exam.id, this.currentUser.id);
            const isSubmitted = !!sub;
            const isGraded = sub && sub.status === 'graded';

            return `
              <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-100 gap-3">
                  <div>
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 mb-2 inline-block">${exam.subject || 'Tổng hợp'}</span>
                    <h3 class="text-lg font-bold text-slate-800">${exam.title}</h3>
                    <div class="flex items-center space-x-4 text-xs text-slate-500 mt-1">
                      <span><i class="fa-regular fa-clock mr-1 text-slate-400"></i>${exam.duration} phút</span>
                      <span><i class="fa-solid fa-list-ol mr-1 text-slate-400"></i>${exam.questions.length} câu hỏi</span>
                    </div>
                  </div>

                  <div>
                    ${!isSubmitted ? `
                      <button onclick="app.startTakeExam('${exam.id}')" class="w-full sm:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md shadow-blue-500/20 transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-play"></i>
                        <span>Bắt Đầu Làm Bài</span>
                      </button>
                    ` : isGraded ? `
                      <button onclick="app.renderStudentResult('${exam.id}')" class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md shadow-emerald-500/20 transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-star"></i>
                        <span>Xem Điểm & Lời Phê</span>
                      </button>
                    ` : `
                      <button onclick="app.renderStudentResult('${exam.id}')" class="w-full sm:w-auto px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl text-xs shadow-md shadow-amber-500/20 transition flex items-center justify-center space-x-1.5">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <span>Xem Bài Chờ Chấm</span>
                      </button>
                    `}
                  </div>
                </div>

                <div class="pt-4 flex items-center justify-between text-xs">
                  <div>
                    ${!isSubmitted ? `
                      <span class="text-slate-500 flex items-center"><span class="w-2 h-2 rounded-full bg-slate-300 mr-2"></span>Trạng thái: Chưa làm bài</span>
                    ` : isGraded ? `
                      <span class="text-emerald-600 font-bold flex items-center">
                        <i class="fa-solid fa-circle-check mr-1.5"></i> Điểm tổng kết: <b class="text-sm ml-1 bg-emerald-50 px-2 py-0.5 rounded text-emerald-700">${sub.grading.totalScore} đ</b>
                      </span>
                    ` : `
                      <span class="text-amber-600 font-medium flex items-center">
                        <i class="fa-solid fa-hourglass-half mr-1.5"></i> Đã nộp bài - Đang chờ thầy cô chấm điểm tự luận
                      </span>
                    `}
                  </div>
                  ${isSubmitted ? `<span class="text-slate-400">Nộp: ${sub.submittedAt}</span>` : ''}
                </div>
              </div>
            `;
          }).join('');
        }

        container.innerHTML = `
          <div class="space-y-6">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg shadow-blue-500/10">
              <span class="px-2.5 py-1 bg-white/20 rounded-md text-xs font-semibold uppercase tracking-wider backdrop-blur-sm">Góc Học Tập</span>
              <h1 class="text-2xl font-black mt-2">Xin chào, ${this.currentUser.name}!</h1>
              <p class="text-blue-100 text-xs sm:text-sm mt-1">Lựa chọn bài kiểm tra để làm bài hoặc theo dõi kết quả chấm điểm và lời phê từ thầy cô.</p>

      },

      /* =========================================================================
         PHÒNG THI TRỰC TUYẾN DÀNH CHO HỌC SINH
         ========================================================================= */
      startTakeExam(examId) {
        const exam = db.getExamById(examId);
        if (!exam) return;

        this.openModal('Bắt đầu làm bài', `Bài kiểm tra "${exam.title}" có thời gian làm bài là ${exam.duration} phút. Bạn đã sẵn sàng chưa?`, () => {
          this.renderExamRoom(exam);
        });
      },

      renderExamRoom(exam) {
        if (this.examTimerInterval) clearInterval(this.examTimerInterval);

        let secondsLeft = exam.duration * 60;
        const container = document.getElementById('appContainer');

        let questionsHtml = exam.questions.map((q, idx) => {
          if (q.type === 'choice') {
            return `
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-bold text-slate-700">Câu Trắc Nghiệm</span>
                  </div>
                  <span class="text-xs font-semibold text-slate-400">(${q.points} điểm)</span>
                </div>
                <p class="text-sm font-semibold text-slate-800">${q.text}</p>
                <div class="space-y-2 pt-1">
                  ${q.options.map((opt, oIdx) => `
                    <label class="flex items-center p-3 rounded-xl border border-slate-200 hover:bg-blue-50/50 hover:border-blue-300 transition cursor-pointer text-xs sm:text-sm text-slate-700 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-600 has-[:checked]:font-semibold">
                      <input type="radio" name="student_q_${q.id}" value="${oIdx}" class="text-blue-600 focus:ring-0 mr-3">
                      <span>${opt}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `;
          } else {
            return `
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-bold text-slate-700">Câu Tự Luận</span>
                  </div>
                  <span class="text-xs font-semibold text-slate-400">(${q.points} điểm)</span>
                </div>
                <p class="text-sm font-semibold text-slate-800 leading-relaxed">${q.text}</p>
                <div>
                  <label class="block text-xs font-bold text-slate-500 mb-1">Khu vực trả lời của bạn:</label>
                  <textarea id="student_essay_${q.id}" rows="5" placeholder="Gõ câu trả lời, suy nghĩ hoặc phân tích tự luận của em vào đây..." class="w-full p-3.5 text-sm rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent leading-relaxed"></textarea>
                </div>
              </div>
            `;
          }
        }).join('');

        container.innerHTML = `
          <div class="max-w-3xl mx-auto space-y-6 pb-20">
            <!-- Sticky Timer Bar -->
            <div class="sticky top-16 z-30 bg-white/95 backdrop-blur-md p-4 rounded-2xl border border-slate-200 shadow-lg flex items-center justify-between">
              <div>
                <span class="text-xs font-bold text-slate-400 uppercase">Đang làm bài:</span>
                <h2 class="text-sm font-bold text-slate-800 truncate max-w-[200px] sm:max-w-xs">${exam.title}</h2>
              </div>
              <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-1.5 px-3 py-1.5 bg-rose-50 text-rose-600 rounded-xl font-mono text-sm font-black border border-rose-100 shadow-inner">
                  <i class="fa-regular fa-clock"></i>
                  <span id="examTimerDisplay">00:00</span>
                </div>
                <button onclick="app.submitExam('${exam.id}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs shadow-md transition">
                  Nộp Bài
                </button>
              </div>
            </div>

            <!-- Questions -->
            <div class="space-y-4">
              ${questionsHtml}
            </div>

            <!-- Bottom Submit Button -->
            <div class="p-6 bg-white rounded-2xl border border-slate-200 text-center space-y-3">
              <p class="text-xs text-slate-500">Hãy rà soát kỹ lại các câu trả lời trắc nghiệm và đoạn văn tự luận trước khi gửi bài.</p>
              <button onclick="app.submitExam('${exam.id}')" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-500/20 transition">
                <i class="fa-solid fa-paper-plane mr-1.5"></i> Xác Nhận Nộp Bài Kiểm Tra
              </button>
            </div>
          </div>
        `;

        // Bộ đếm thời gian
        const timerDisplay = document.getElementById('examTimerDisplay');
        const updateTimer = () => {
          const m = Math.floor(secondsLeft / 60);
          const s = secondsLeft % 60;
          timerDisplay.textContent = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;

          if (secondsLeft <= 0) {
            clearInterval(this.examTimerInterval);
            this.showToast('Hết giờ', 'Thời gian làm bài đã kết thúc! Hệ thống đang tự động nộp bài.', 'info');
            this.executeSubmit(exam.id);
          }
          secondsLeft--;
        };

        updateTimer();
        this.examTimerInterval = setInterval(updateTimer, 1000);
      },

      submitExam(examId) {
        this.openModal('Xác nhận nộp bài', 'Bạn có chắc chắn muốn nộp bài kiểm tra ngay bây giờ? Bạn sẽ không thể sửa lại câu trả lời sau khi nộp.', () => {
          this.executeSubmit(examId);
        });
      },

      executeSubmit(examId) {
        if (this.examTimerInterval) clearInterval(this.examTimerInterval);

        const exam = db.getExamById(examId);
        const answers = {};

        exam.questions.forEach(q => {
          if (q.type === 'choice') {
            const checked = document.querySelector(`input[name="student_q_${q.id}"]:checked`);
            if (checked) {
              answers[q.id] = parseInt(checked.value);
            }
          } else {
            const textarea = document.getElementById(`student_essay_${q.id}`);
            if (textarea) {
              answers[q.id] = textarea.value.trim();
            }
          }
        });

        const newSubmission = {
          id: 'sub_' + Date.now(),
          examId: examId,
          studentId: this.currentUser.id,
          submittedAt: new Date().toLocaleString('vi-VN'),
          status: 'submitted', // Chờ giáo viên chấm
          answers: answers
        };

        db.saveSubmission(newSubmission);
        this.showToast('Nộp bài thành công!', 'Bài làm của bạn đã được chuyển tới giáo viên để chấm điểm.');
        this.renderStudentDashboard();
      },

      /* =========================================================================
         XEM KẾT QUẢ, ĐIỂM SỐ & LỜI PHÊ CHI TIẾT DÀNH CHO HỌC SINH
         ========================================================================= */
      renderStudentResult(examId) {
        const exam = db.getExamById(examId);
        const sub = db.getSubmission(examId, this.currentUser.id);
        const container = document.getElementById('appContainer');

        if (!sub) {
          this.renderStudentDashboard();
          return;
        }

        const isGraded = sub.status === 'graded';

        let questionsHtml = exam.questions.map((q, idx) => {
          const studentAns = sub.answers ? sub.answers[q.id] : null;
          const assignedScore = sub.grading?.scores ? sub.grading.scores[q.id] : undefined;
          const comment = sub.grading?.comments ? sub.grading.comments[q.id] : '';

          if (q.type === 'choice') {
            const isCorrect = isGraded && assignedScore > 0;
            return `
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-bold text-slate-700">Trắc nghiệm</span>
                  </div>
                  <div>
                    ${isGraded ? `
                      <span class="text-xs font-bold ${isCorrect ? 'text-emerald-600' : 'text-rose-500'}">
                        ${isCorrect ? `<i class="fa-solid fa-check mr-1"></i>Đúng (+${assignedScore}đ)` : '<i class="fa-solid fa-xmark mr-1"></i>Sai (0đ)'}
                      </span>
                    ` : '<span class="text-xs text-slate-400">Đang chờ tổng hợp</span>'}
                  </div>
                </div>
                <p class="text-sm font-semibold text-slate-800">${q.text}</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                  ${q.options.map((opt, oIdx) => {
                    const isSelected = studentAns !== null && parseInt(studentAns) === oIdx;
                    const isCorrectOption = q.correctAnswer === oIdx;
                    let style = 'border-slate-200 bg-slate-50 text-slate-600';

                    if (isGraded) {
                      if (isCorrectOption) style = 'border-emerald-300 bg-emerald-50 text-emerald-800 font-bold';
                      if (isSelected && !isCorrectOption) style = 'border-rose-300 bg-rose-50 text-rose-800 font-bold line-through';
                    } else if (isSelected) {
                      style = 'border-blue-400 bg-blue-50 text-blue-700 font-semibold';
                    }

                    return `
                      <div class="p-2.5 rounded-xl border flex items-center justify-between ${style}">
                        <span>${opt}</span>
                        ${isSelected ? '<span class="text-[10px] bg-slate-700 text-white px-1.5 py-0.5 rounded">Em đã chọn</span>' : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `;
          } else {
            return `
              <div class="bg-white p-5 rounded-2xl border-2 ${isGraded ? 'border-indigo-100' : 'border-slate-200'} shadow-sm space-y-3">
                <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                  <div class="flex items-center space-x-2">
                    <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs flex items-center justify-center">${idx + 1}</span>
                    <span class="text-xs font-bold text-slate-700">Tự Luận</span>
                  </div>
                  <div>
                    ${isGraded ? `
                      <span class="text-xs font-extrabold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-full">
                        Đạt ${assignedScore} / ${q.points} điểm
                      </span>
                    ` : '<span class="text-xs text-amber-600 font-semibold"><i class="fa-solid fa-clock mr-1"></i>Chờ thầy cô chấm điểm</span>'}
                  </div>
                </div>

                <div>
                  <h4 class="text-xs font-bold text-slate-400 mb-1">Đề bài:</h4>
                  <p class="text-sm font-semibold text-slate-800">${q.text}</p>
                </div>

                <div>
                  <h4 class="text-xs font-bold text-slate-500 mb-1">Bài làm của em:</h4>
                  <div class="p-3.5 rounded-xl bg-slate-50 text-xs sm:text-sm text-slate-800 whitespace-pre-wrap leading-relaxed border border-slate-200">
                    ${studentAns ? studentAns : '<i class="text-slate-400">Em không trả lời câu hỏi này.</i>'}
                  </div>
                </div>

                <!-- Lời phê của giáo viên cho câu tự luận này -->
                ${isGraded && comment ? `
                  <div class="p-3.5 bg-emerald-50/80 border border-emerald-200 rounded-xl">
                    <span class="text-xs font-bold text-emerald-800 flex items-center mb-1">
                      <i class="fa-solid fa-comment-dots mr-1.5"></i> Lời phê của Thầy/Cô:
                    </span>
                    <p class="text-xs sm:text-sm text-emerald-950 font-medium">${comment}</p>
                  </div>
                ` : ''}
              </div>
            `;
          }
        }).join('');

        container.innerHTML = `
          <div class="max-w-3xl mx-auto space-y-6">
            <div class="flex items-center justify-between">
              <button onclick="app.renderStudentDashboard()" class="text-slate-500 hover:text-slate-800 text-sm font-semibold flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Quay lại trang chủ</span>
              </button>
              <div class="text-xs text-slate-400 font-medium">Nộp lúc: ${sub.submittedAt}</div>
            </div>

            <!-- Tổng kết điểm & Lời phê chung -->
            <div class="bg-white rounded-2xl p-6 border ${isGraded ? 'border-emerald-300 shadow-xl' : 'border-slate-200 shadow-sm'}">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-100">
                <div>
                  <span class="text-xs font-bold px-2 py-0.5 rounded bg-blue-50 text-blue-600">${exam.subject}</span>
                  <h1 class="text-xl font-bold text-slate-800 mt-1">${exam.title}</h1>
                </div>

                <div class="text-center sm:text-right shrink-0">
                  ${isGraded ? `
                    <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider">Điểm Tổng Kết</span>
                    <div class="text-3xl font-black text-emerald-600">${sub.grading.totalScore} <span class="text-sm font-medium text-slate-400">/ 10</span></div>
                  ` : `
                    <div class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-amber-100 text-amber-700">
                      <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Đang Chờ Chấm
                    </div>
                  `}
                </div>
              </div>

              ${isGraded ? `
                <div class="mt-4 p-4 rounded-xl bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-200">
                  <h3 class="text-xs font-bold text-emerald-800 uppercase tracking-wider flex items-center mb-1">
                    <i class="fa-solid fa-quote-left mr-2 text-emerald-600"></i> Lời Phê Tổng Quát Của Thầy Cô:
                  </h3>
                  <p class="text-sm text-emerald-950 font-medium leading-relaxed italic">
                    "${sub.grading.overallComment || 'Bài làm đạt yêu cầu, cần tiếp tục phát huy!'}"
                  </p>
                </div>
              ` : `
                <p class="text-xs text-slate-500 mt-4">
                  <i class="fa-solid fa-circle-info text-blue-500 mr-1"></i> Bài thi tự luận của em đã được gửi thành công đến giáo viên. Kết quả và lời phê chi tiết sẽ xuất hiện tại đây ngay khi thầy cô chấm xong!
                </p>
              `}
            </div>

            <!-- Danh sách chi tiết câu hỏi -->
            <div class="space-y-4">
              <h2 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Chi Tiết Bài Làm & Nhận Xét Từng Câu</h2>
              ${questionsHtml}
            </div>
          </div>
        `;
      }
    };

    // Khởi chạy ứng dụng khi DOM tải xong
    window.onload = function() {
      app.init();
    };
  </script>
</body>
</html>
